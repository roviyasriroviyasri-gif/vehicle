<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Recognition System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="vrs-root">
  <div class="vrs-wrap">
    <div class="vrs-eyebrow">Vehicle Intelligence Console</div>
    <h1 class="vrs-title">Vehicle <span>Recognition</span> System</h1>
    <p class="vrs-sub">Upload a photo of any vehicle. The model reads its visual signature — badge, body, stance — and returns an identification plate with specs, features and a condition read.</p>

    <div class="vrs-keybar">
      <span class="vrs-keylabel">Groq API Key</span>
      <input id="vrsKey" type="password" placeholder="gsk_...  (used only in your browser, never stored)" autocomplete="off"/>
    </div>

    <div id="vrsDrop" class="vrs-drop">
      <input id="vrsFile" type="file" accept="image/*"/>
      <div class="vrs-drop-inner" id="vrsDropInner">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 16.5V6.75A2.25 2.25 0 0 1 5.25 4.5h13.5A2.25 2.25 0 0 1 21 6.75v9.75M3 16.5A2.25 2.25 0 0 0 5.25 18.75h13.5A2.25 2.25 0 0 0 21 16.5M3 16.5l5.15-5.15a1.5 1.5 0 0 1 2.12 0l1.98 1.98m0 0 2.5-2.5a1.5 1.5 0 0 1 2.12 0L21 14.5"/><circle cx="8" cy="8.5" r="1.25"/></svg>
        <div class="t1">Drop a vehicle photo</div>
        <div class="t2">or click to browse — JPG / PNG</div>
      </div>
    </div>

    <div class="vrs-status" id="vrsStatus"></div>
    <button class="vrs-analyzebtn" id="vrsAnalyzeBtn" disabled>Identify Vehicle</button>

    <div id="vrsResult"></div>
  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
